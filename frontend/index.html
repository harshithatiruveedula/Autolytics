<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--navy:#0b1c3a;--blue:#2864f0;--ink:#14264a;--muted:#7285a7;--line:#e4ebf6;--bg:#f7f9fd}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea{font:inherit}.layout{width:100%;max-width:100%;display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 2px);background:var(--bg);border-radius:12px;overflow:hidden}.sidebar{background:linear-gradient(180deg,#0b1b38,#0c2147);color:white;display:flex;flex-direction:column;padding:26px 13px;min-height:calc(100vh - 2px)}.brand{display:flex;gap:12px;align-items:center;padding:0 8px 32px}.mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#4788ff,#204bd7);display:grid;place-items:center;font-size:24px;font-weight:850}.brandname{font-weight:850;font-size:17px;letter-spacing:.04em}.tagline{color:#a8bbdf;font-size:11px;margin-top:3px}.nav{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:9px;color:#d5e0f5;font-size:14px;margin:3px 0;cursor:pointer;border:1px solid transparent}.nav:hover{background:#172e54}.nav.active{background:#2f5eb8;color:white;border-color:#4475d5;position:relative;isolation:isolate;overflow:hidden}.nav.active::before{content:"";position:absolute;inset:-140%;z-index:-2;background:conic-gradient(from 0deg,transparent 0deg,transparent 285deg,#78d4ff 325deg,#4f83ff 345deg,transparent 360deg);animation:navBlueSpin 1.8s linear infinite}.nav.active::after{content:"";position:absolute;inset:1px;border-radius:8px;background:#2f5eb8;z-index:-1}.nav.active>*{position:relative;z-index:1}@keyframes navBlueSpin{to{transform:rotate(360deg)}}.nav.busy{box-shadow:0 0 0 2px rgba(87,155,255,.18),0 0 18px rgba(65,133,255,.3)}.drop.uploading{border-color:#3477ff;background:linear-gradient(120deg,#f5f9ff,#eaf2ff);box-shadow:0 0 0 3px rgba(40,100,240,.08)}.drop.uploading .uploadicon{animation:uploadPulse 1s ease-in-out infinite}@keyframes uploadPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(40,100,240,.25)}50%{transform:scale(1.07);box-shadow:0 0 0 8px rgba(40,100,240,0)}}.navicon{width:20px;text-align:center;font-size:18px}.quote{margin-top:auto;padding:25px 12px 8px;color:#dce7ff;font-size:14px;line-height:1.55}.main{padding:25px 28px 28px;min-width:0}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;background:linear-gradient(115deg,#e3fafb,#eaf0ff 62%,#f4edff);border:1px solid #e1eafb;border-radius:17px;padding:16px;margin-bottom:18px;min-height:226px}.hero-copy{padding:20px 14px;align-self:center}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.14em;color:#4566a7;margin:0 0 15px}.hero h1{font-size:27px;line-height:1.27;margin:0 0 15px;letter-spacing:-.025em;color:#11254b}.hero p.sub{font-size:14px;line-height:1.7;color:#52698e;max-width:430px;margin:0}.art{display:flex;align-items:center;justify-content:center;gap:15px;color:#3774f4;font-size:45px;margin-top:16px}.filecard{background:rgba(255,255,255,.85);border:1px solid #e0e9f8;border-radius:13px;padding:13px;display:flex;flex-direction:column;justify-content:center;min-width:0}.drop{min-height:180px;border:1.5px dashed #a9c4ff;border-radius:11px;background:linear-gradient(180deg,#fff,#fbfdff);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;cursor:pointer}.uploadicon{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#edf3ff;color:#2c66ef;font-size:23px;margin-bottom:10px}.drop strong{font-size:14px;color:#42639d}.drop small{font-size:11px;color:#8799b9;margin-top:8px}.fileinfo{display:flex;align-items:center;gap:9px;font-size:12px;color:#455b81;margin-top:12px;min-width:0}.fileinfo .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.fileinfo button{border:0;background:transparent;color:#6f83a4;cursor:pointer;font-size:17px}.hidden{display:none!important}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px 19px;margin-bottom:18px;box-shadow:0 4px 18px rgba(25,51,95,.025)}.cardhead{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:13px}.headtitle{font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px}.headicon{font-size:21px;color:#194d9d}.metrics{display:flex;align-items:center;gap:17px}.metric{border-left:1px solid #e8eef8;padding-left:14px;min-width:76px}.metric:first-child{border:0}.mlabel{font-size:10px;color:#8295b7;margin-bottom:4px}.mvalue{font-size:14px;font-weight:850;color:#15294d}.tablewrap{border:1px solid #e4ebf6;border-radius:8px;overflow:auto}.table{border-collapse:collapse;width:100%;font-size:11px;white-space:nowrap}.table th{background:#f4f7fc;text-align:left;font-weight:750;padding:11px 12px;border-right:1px solid #e2e9f4;border-bottom:1px solid #e2e9f4}.table th span{display:block;font-weight:450;color:#8195b8;margin-top:4px}.table td{padding:10px 12px;border-right:1px solid #e7edf6;border-bottom:1px solid #e7edf6;color:#1c3155}.table tr:last-child td{border-bottom:0}.table tr:hover td{background:#f8faff}.tablefoot{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:#7589ad;font-size:11px}.pages{display:flex;gap:5px;align-items:center}.pages button{border:0;background:white;border-radius:5px;min-width:24px;height:26px;color:#34517d;cursor:pointer;font-size:11px}.pages button.active{background:#2864f0;color:white}.querytitle{font-size:16px;font-weight:800;display:flex;gap:10px;align-items:center}.qsub{font-size:11px;color:#7589ad;margin:6px 0 17px}.queryrow{display:flex;gap:12px;align-items:stretch}.queryrow textarea{resize:vertical;min-height:57px;flex:1;border:1px solid #dfe8f8;border-radius:8px;padding:13px 14px;color:#1b2f54;outline:none;font-size:12px;line-height:1.5}.queryrow textarea:focus{border-color:#80a6ff;box-shadow:0 0 0 3px #eaf0ff}.run{background:#2864f0;color:white;border:0;border-radius:8px;padding:0 17px;font-size:12px;font-weight:750;cursor:pointer;min-width:115px}.run:hover{background:#1f54d6}.suggestions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:11px;color:#3c70df}.chip{border:1px solid #e2eaf8;background:#f7faff;color:#3561b1;border-radius:18px;padding:7px 11px;font-size:10px;cursor:pointer}.chip:hover{background:#edf3ff;border-color:#b9ceff}.result{margin-top:16px;border-top:1px solid #edf1f8;padding-top:14px}.sql{background:#f5f7fb;border-radius:8px;padding:12px;font:12px ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#275aaf}.msg{padding:10px 12px;border-radius:8px;background:#fff4e5;color:#8a5310;font-size:12px;margin-top:12px}.success{background:#ecfdf4;color:#166442}.cleaning{margin:0 0 13px;background:#f1f6ff;border:1px solid #e1eaff;border-radius:8px;padding:9px 12px;font-size:11px;color:#49618b;line-height:1.6}.blank{color:#94a3b8;font-style:italic}.pageplaceholder{background:white;border:1px solid var(--line);border-radius:15px;padding:35px;color:#64748b}
.rotating-highlight{position:relative!important;border:1px solid #4475d5!important;isolation:isolate;overflow:hidden!important}
.rotating-highlight::before{content:"";position:absolute;inset:-140%;z-index:-2;pointer-events:none;background:conic-gradient(from 0deg,transparent 0deg,transparent 285deg,#78d4ff 325deg,#4f83ff 345deg,transparent 360deg);animation:navBlueSpin 1.8s linear infinite}
.rotating-highlight::after{content:"";position:absolute;inset:2px;border-radius:inherit;background:#fff;z-index:-1;pointer-events:none}
.rotating-highlight>*{position:relative;z-index:1}
#uploadSection.rotating-highlight::after{background:rgba(255,255,255,.98)}
#querySection.rotating-highlight::after{background:#fff}
@media(max-width:900px){.layout{grid-template-columns:190px minmax(0,1fr)}.main{padding:16px}.hero{grid-template-columns:1fr}.hero-copy{padding:10px}.filecard{min-height:190px}.hero h1{font-size:23px}.metrics{gap:8px}.metric{min-width:55px;padding-left:8px}}@media(max-width:650px){.layout{grid-template-columns:1fr}.sidebar{min-height:0;padding:12px}.brand{padding-bottom:12px}.nav{display:inline-flex;margin:2px;padding:9px}.quote{display:none}.main{padding:12px}.cardhead{align-items:flex-start;flex-direction:column}.metrics{width:100%;justify-content:space-between}.queryrow{flex-direction:column}.run{min-height:42px}.hero h1{font-size:22px}}
</style></head><body><div id="root"></div><script>
let args={}, state={page:1, query:"", file:null, busyQuery:false, busyUpload:false}; const root=document.getElementById('root');
let eventCounter=0; function send(value){value.event_id=String(Date.now())+'-'+String(++eventCounter)+'-'+Math.random().toString(36).slice(2,8);window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value,dataType:'json'},'*')}
function ready(){window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*')}
function height(){const h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight,700);window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:h},'*')}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(x){if(x===null||x===undefined||x==='')return '<span class="blank">Missing</span>';return esc(x)}
function typeName(t){if(/int|float|double|decimal/i.test(t||''))return 'Number';if(/date|time/i.test(t||''))return 'Date';return 'Text'}
function navItem(label,key,icon){return `<div class="nav ${args.nav===key?'active':''} ${state.busyQuery&&key==='query'?'busy':''}" data-nav="${key}"><span class="navicon">${icon}</span>${label}</div>`}
function uploadStatus(title, detail){const drop=document.getElementById('drop');if(!drop)return;drop.classList.add('uploading');const strong=drop.querySelector('strong'), smalls=drop.querySelectorAll('small'), button=document.getElementById('chooseFile');if(strong)strong.textContent=title;if(smalls[0])smalls[0].textContent=detail||'Please wait…';if(button){button.disabled=true;button.textContent='Processing…';button.style.opacity='.7';}}
function sendQuery(value){if(state.busyQuery)return;state.busyQuery=true;state.query=value;const run=document.getElementById('run');if(run){run.disabled=true;run.textContent='Running…';run.style.opacity='.75';}document.querySelectorAll('[data-nav="query"]').forEach(el=>el.classList.add('busy'));send({action:'query',query:value});}
function scrollToNavTarget(target){const id=target==='upload'?'uploadSection':target==='query'?'querySection':null;if(!id)return;const el=document.getElementById(id);if(!el)return;el.classList.add('rotating-highlight');try{const frame=window.frameElement;const parent=window.parent;if(frame&&parent&&parent!==window){const frameRect=frame.getBoundingClientRect();const targetTop=frameRect.top+parent.scrollY+el.getBoundingClientRect().top-(parent.innerHeight*0.12);const scrollTop=Math.max(0,targetTop);const scroller=parent.document.scrollingElement||parent.document.documentElement;if(scroller&&typeof scroller.scrollTo==='function')scroller.scrollTo({top:scrollTop,behavior:'smooth'});parent.scrollTo({top:scrollTop,behavior:'smooth'});}}catch(e){}try{el.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){el.scrollIntoView(true);}}
function render(){if(args.query_result||args.query_error)state.busyQuery=false;if(args.file)state.busyUpload=false;let data=args.data||{}, rows=data.rows||[], cols=data.columns||[], total=data.total_rows||0, file=args.file||null, nav=args.nav||'home';
let html=`<div class="layout"><aside class="sidebar"><div class="brand"><div class="mark">A</div><div><div class="brandname">AUTOLYTICS</div><div class="tagline">From Data to Decisions</div></div></div>${navItem('Home','home','⌂')}${navItem('Upload Dataset','upload','⇧')}${navItem('Query Dataset','query','⌕')}${navItem('EDA & Visuals','eda','▥')}${navItem('Modeling','modeling','♧')}${navItem('Reports','reports','▤')}<div class="quote">“Better data.<br>Smarter decisions.”<br><span style="font-size:22px">—</span></div></aside><main class="main">`;
if(nav==='eda'||nav==='modeling'||nav==='reports'){let name=nav==='eda'?'EDA & Visuals':nav==='modeling'?'Modeling':'Reports';html+=`<div class="pageplaceholder"><div class="eyebrow">AUTOLYTICS WORKSPACE</div><h2>${name}</h2><p>This module will be connected to your dataset in the next implementation step.</p></div>`;}
else {html+=`<section class="hero"><div class="hero-copy"><div class="eyebrow">WELCOME TO AUTOLYTICS</div><h1>Upload your dataset and<br>start exploring your data</h1><p class="sub">Get instant insights with automatic cleaning, smart queries and data analysis.</p><div class="art"><span>☁</span><span style="font-size:34px">▤</span><span style="font-size:12px;font-weight:800">CSV&nbsp;&nbsp; XLSX</span></div></div><div class="filecard ${nav==='upload'?'rotating-highlight':''}" id="uploadSection"><div class="drop" id="drop"><div class="uploadicon">⇧</div><strong>Drag &amp; drop your file here</strong><small>or</small><button class="run" id="chooseFile" type="button" style="margin-top:12px;min-height:37px">Choose File</button><small>Supports CSV and Excel files (.csv, .xlsx)</small><input id="file" type="file" accept=".csv,.xlsx" class="hidden"></div>${file?`<div class="fileinfo"><span style="font-size:24px;color:#8aa6db">▤</span><span class="fname">${esc(file.name)}</span><span>${esc(file.size_label)}</span><button data-action="clearfile" title="Remove file">×</button></div>`:''}</div></section>`;
if(rows.length||total){html+=`<section class="card"><div class="cardhead"><div><div class="headtitle"><span class="headicon">▤</span>Dataset Preview</div><div class="muted" style="margin-top:6px">Automatically cleaned and imputed working dataset</div></div><div class="metrics"><div class="metric"><div class="mlabel">▦ Rows</div><div class="mvalue">${Number(total).toLocaleString()}</div></div><div class="metric"><div class="mlabel">☷ Columns</div><div class="mvalue">${cols.length}</div></div><div class="metric"><div class="mlabel">▢ File Size</div><div class="mvalue">${esc(file?.size_label||'—')}</div></div></div></div>`;
if(args.cleaning_summary)html+=`<div class="cleaning">✓ ${esc(args.cleaning_summary)}</div>`;
html+=`<div class="tablewrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${esc(c.name)}<span>(${typeName(c.type)})</span></th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${fmt(r[c.name])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="tablefoot"><span>Showing ${total?Math.min((state.page-1)*5+1,total):0}–${Math.min(state.page*5,total)} of ${Number(total).toLocaleString()} rows</span><div class="pages"><button data-page="${Math.max(1,state.page-1)}">‹</button><button class="active">${state.page}</button><button data-page="${Math.min(Math.ceil(total/5),state.page+1)}">›</button></div></div></section>`;}
else {html+=`<section class="card" style="text-align:center;padding:25px;color:#7185a6">Your dataset preview will appear here after you upload a CSV or Excel file.</section>`;}
html+=`<section class="card ${nav==='query'?'rotating-highlight':''}" id="querySection"><div class="querytitle"><span class="headicon">✦</span>Ask a Question About Your Data</div><div class="qsub">Type your query in natural language or write SQL. Get instant results below.</div><div class="queryrow"><textarea id="query" placeholder="Example: Show total sales by city  |  Which product has the highest revenue?  |  Write a SQL query...">${esc(state.query)}</textarea><button class="run" id="run">➤ &nbsp; Run Query</button></div><div class="suggestions"><b>✦ &nbsp;Try asking:</b><button class="chip" data-query="Show the first 5 rows">Show the first 5 rows</button><button class="chip" data-query="Average Age by Gender">Average age by gender</button><button class="chip" data-query="Count records by category">Count records by category</button><button class="chip" data-query="How many records are there?">Count records</button></div>${args.query_error?`<div class="msg">${esc(args.query_error)}</div>`:''}${args.query_result?`<div class="result">${args.query_result.sql?`<div style="font-weight:750;font-size:12px;margin-bottom:8px">${args.query_result.generated_sql?'Generated SQL':'Executed SQL'}</div><div class="sql">${esc(args.query_result.sql)}</div>`:''}${args.query_result.rows?`<div style="font-weight:750;font-size:12px;margin:13px 0 8px">Query Results</div><div class="tablewrap"><table class="table"><thead><tr>${args.query_result.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${args.query_result.rows.map(r=>`<tr>${args.query_result.columns.map(c=>`<td>${fmt(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="muted" style="margin-top:8px">${args.query_result.count} result rows</div>`:''}</div>`:''}</section>`;}
html+='</main></div>';root.innerHTML=html;bind();height();}
function bind(){document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=e=>{e.preventDefault();e.stopPropagation();const target=el.dataset.nav;args.nav=target;render();if(target==='upload'||target==='query'){const applyTarget=()=>{const section=document.getElementById(target==='upload'?'uploadSection':'querySection');if(section){section.classList.add('rotating-highlight');scrollToNavTarget(target);}};requestAnimationFrame(applyTarget);setTimeout(applyTarget,180);setTimeout(applyTarget,450);}send({action:'nav',nav:target})});const inp=document.getElementById('file');const drop=document.getElementById('drop');if(inp&&drop){drop.onclick=e=>{if(e.target.closest('#chooseFile'))return;inp.click()};const choose=document.getElementById('chooseFile');if(choose)choose.onclick=e=>{e.preventDefault();e.stopPropagation();inp.click()};inp.onchange=()=>{if(inp.files[0])readFile(inp.files[0])};drop.ondragover=e=>{e.preventDefault();drop.style.background='#edf4ff'};drop.ondragleave=()=>drop.style.background='';drop.ondrop=e=>{e.preventDefault();drop.style.background='';if(e.dataTransfer.files[0])readFile(e.dataTransfer.files[0])};}document.querySelectorAll('[data-action="clearfile"]').forEach(el=>el.onclick=()=>send({action:'clear_file'}));document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>{state.page=Number(el.dataset.page);send({action:'page',page:state.page})});const q=document.getElementById('query');if(q){q.oninput=()=>state.query=q.value;q.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();e.stopPropagation();sendQuery(q.value)}};}const run=document.getElementById('run');if(run)run.onclick=e=>{e.preventDefault();sendQuery(q?q.value:'')};document.querySelectorAll('[data-query]').forEach(el=>el.onclick=()=>{state.query=el.dataset.query;sendQuery(state.query)});}
async function blobToBase64(blob){return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const result=String(reader.result||'');resolve(result.includes(',')?result.slice(result.indexOf(',')+1):result)};reader.onerror=()=>reject(new Error('Could not encode file'));reader.readAsDataURL(blob);});}
async function readFile(file){if(state.busyUpload)return;const name=file.name.toLowerCase();if(!name.endsWith('.csv')&&!name.endsWith('.xlsx')){send({action:'upload_error',error:'Please choose a CSV or XLSX file.'});return;}state.busyUpload=true;uploadStatus('Preparing your dataset…',file.size>15*1024*1024?'Large file detected. Compressing to speed up transfer.':'Reading selected file.');await new Promise(resolve=>requestAnimationFrame(()=>resolve()));try{let payloadBlob=file,compressed=false;if(name.endsWith('.csv')&&'CompressionStream' in window){uploadStatus('Compressing CSV…','This reduces upload time for large CSV files.');payloadBlob=await new Response(file.stream().pipeThrough(new CompressionStream('gzip'))).blob();compressed=true;}uploadStatus('Sending dataset…','Please keep this tab open while AUTOLYTICS processes the file.');const data=await blobToBase64(payloadBlob);send({action:'upload',name:file.name,size:file.size,data,compressed});}catch(err){state.busyUpload=false;send({action:'upload_error',error:'The selected file could not be read. Please try again.'});}}
window.addEventListener('message',e=>{if(e.data&&e.data.type==='streamlit:render'){args=e.data.args||{};if(args.query_result||args.query_error)state.busyQuery=false;if(args.file)state.busyUpload=false;render();if(args.nav==='upload'||args.nav==='query'){const target=args.nav;const applyTarget=()=>{const section=document.getElementById(target==='upload'?'uploadSection':'querySection');if(section)section.classList.add('rotating-highlight');scrollToNavTarget(target);};requestAnimationFrame(applyTarget);setTimeout(applyTarget,180);}}});ready();
</script></body></html>
