<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--navy:#0b1c3a;--blue:#2864f0;--ink:#14264a;--muted:#7285a7;--line:#e4ebf6;--bg:#f7f9fd}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea{font:inherit}
/* The EDA page keeps this existing sidebar in a narrow fixed component frame;
   Python renders the analytics content beside it to avoid nested page layouts. */
.layout{width:100%;max-width:100%;display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;height:auto;background:var(--bg);border-radius:12px;overflow:visible}
.layout.eda-mode{grid-template-columns:248px minmax(0,1fr);min-height:100vh;height:auto;overflow:visible;border-radius:0;background:var(--bg)}
.layout.eda-mode.is-collapsed{grid-template-columns:64px minmax(0,1fr)}
.sidebar{background:linear-gradient(180deg,#0b1b38,#0c2147);color:white;display:flex;flex-direction:column;padding:18px 8px;min-height:100vh;height:100vh}
.layout.eda-mode .sidebar{min-height:100vh;height:100vh;padding:14px 8px;position:relative}
.eda-nav-toggle{width:100%;height:34px;border:1px solid #2d4772;background:#10294f;color:#dce8ff;border-radius:7px;cursor:pointer;margin-bottom:14px;font-size:16px}
.eda-nav-toggle:hover{background:#1b3a6b}
.layout.eda-mode .sidebar-collapsed{width:64px;min-width:64px;padding:14px 6px;overflow:hidden}
.layout.eda-mode .sidebar-collapsed .eda-nav-toggle{width:50px;min-width:50px;padding:0}
.layout.eda-mode .sidebar-collapsed .nav{width:50px;min-width:50px;min-height:42px;box-sizing:border-box}
.layout.eda-mode .sidebar-collapsed .navicon{display:inline-flex;align-items:center;justify-content:center;flex:0 0 20px}
.layout.eda-mode .sidebar-collapsed .nav.active::before{inset:-90%}
.layout.eda-mode .sidebar-collapsed .brand{justify-content:center;padding:0 0 24px}
.layout.eda-mode .sidebar-collapsed .brand>div:last-child{display:none}

.layout.eda-mode .sidebar-collapsed .navlabel{display:none}
.layout.eda-mode .sidebar-collapsed .navicon{font-size:19px;width:auto}
.layout.eda-mode .sidebar-collapsed .quote{display:none}
.layout.eda-mode .brand{gap:8px;padding:0 5px 27px}.layout.eda-mode .mark{width:34px;height:34px;border-radius:8px;font-size:19px}.layout.eda-mode .brandname{font-size:14px}.layout.eda-mode .tagline{font-size:9px}.layout.eda-mode .nav{font-size:12px;padding:11px 8px;gap:9px}.layout.eda-mode .quote{font-size:11px;padding:20px 6px 8px}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 32px}.mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#4788ff,#204bd7);display:grid;place-items:center;font-size:24px;font-weight:850}.brandname{font-weight:850;font-size:17px;letter-spacing:.04em}.tagline{color:#a8bbdf;font-size:11px;margin-top:3px}
.nav{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:9px;color:#d5e0f5;font-size:14px;margin:3px 0;cursor:pointer;border:1px solid transparent}.nav:hover{background:#172e54}
.nav.active{background:#2f5eb8;color:white;border-color:#4475d5;position:relative;isolation:isolate;overflow:hidden}
.nav.active::before{content:"";position:absolute;inset:-140%;z-index:-2;background:conic-gradient(from 0deg,transparent 0deg,transparent 285deg,#78d4ff 325deg,#4f83ff 345deg,transparent 360deg);animation:navBlueSpin 1.8s linear infinite}
.nav.active::after{content:"";position:absolute;inset:1px;border-radius:8px;background:#2f5eb8;z-index:-1}
.nav.active>*{position:relative;z-index:1}
@keyframes navBlueSpin{to{transform:rotate(360deg)}}
.nav.busy{box-shadow:0 0 0 2px rgba(87,155,255,.18),0 0 18px rgba(65,133,255,.3)}
.drop.uploading{border-color:#3477ff;background:linear-gradient(120deg,#f5f9ff,#eaf2ff);box-shadow:0 0 0 3px rgba(40,100,240,.08)}
.drop.uploading .uploadicon{animation:uploadPulse 1s ease-in-out infinite}
@keyframes uploadPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(40,100,240,.25)}50%{transform:scale(1.07);box-shadow:0 0 0 8px rgba(40,100,240,0)}}

.drop{min-height:180px;border:1.5px dashed #a9c4ff;border-radius:11px;background:linear-gradient(180deg,#fff,#fbfdff);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;cursor:pointer}

.fileinfo button{border:0;background:transparent;color:#6f83a4;cursor:pointer;font-size:17px}
.hidden{display:none!important}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px 19px;margin-bottom:18px;box-shadow:0 4px 18px rgba(25,51,95,.025)}
.cardhead{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:13px}
.headtitle{font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px}
.headicon{font-size:21px;color:#194d9d}
.metrics{display:flex;align-items:center;gap:17px}
.metric{border-left:1px solid #e8eef8;padding-left:14px;min-width:76px}.metric:first-child{border:0}
.mlabel{font-size:10px;color:#8295b7;margin-bottom:4px}
.mvalue{font-size:14px;font-weight:850;color:#15294d}
.tablewrap{border:1px solid #e4ebf6;border-radius:8px;overflow:auto}
.table{border-collapse:collapse;width:100%;font-size:11px;white-space:nowrap}
.table th{background:#f4f7fc;text-align:left;font-weight:750;padding:11px 12px;border-right:1px solid #e2e9f4;border-bottom:1px solid #e2e9f4}
.table th span{display:block;font-weight:450;color:#8195b8;margin-top:4px}
.table td{padding:10px 12px;border-right:1px solid #e7edf6;border-bottom:1px solid #e7edf6;color:#1c3155}
.table tr:last-child td{border-bottom:0}.table tr:hover td{background:#f8faff}
.tablefoot{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:#7589ad;font-size:11px}
.pages{display:flex;gap:5px;align-items:center}
.pages button{border:0;background:white;border-radius:5px;min-width:24px;height:26px;color:#34517d;cursor:pointer;font-size:11px}
.pages button.active{background:#2864f0;color:white}
.querytitle{font-size:16px;font-weight:800;display:flex;gap:10px;align-items:center}
.qsub{font-size:11px;color:#7589ad;margin:6px 0 17px}
.queryrow{display:flex;gap:12px;align-items:stretch}
.queryrow textarea{resize:vertical;min-height:57px;flex:1;border:1px solid #dfe8f8;border-radius:8px;padding:13px 14px;color:#1b2f54;outline:none;font-size:12px;line-height:1.5}

.run{background:#2864f0;color:white;border:0;border-radius:8px;padding:0 17px;font-size:12px;font-weight:750;cursor:pointer;min-width:115px}.run:hover{background:#1f54d6}
.suggestions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:11px;color:#3c70df}
.chip{border:1px solid #e2eaf8;background:#f7faff;color:#3561b1;border-radius:18px;padding:7px 11px;font-size:10px;cursor:pointer}.chip:hover{background:#edf3ff;border-color:#b9ceff}
.result{margin-top:16px;border-top:1px solid #edf1f8;padding-top:14px}

.msg{padding:10px 12px;border-radius:8px;background:#fff4e5;color:#8a5310;font-size:12px;margin-top:12px}

.blank{color:#94a3b8;font-style:italic}
.pageplaceholder{background:white;border:1px solid var(--line);border-radius:15px;padding:35px;color:#64748b}

.eda-gen-btn{background:#2864f0;color:white;border:0;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:750;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}

.eda-status{background:#f1f6ff;border:1px solid #dde8ff;border-radius:8px;padding:10px 14px;font-size:12px;color:#3558a0;margin-top:10px;display:flex;align-items:center;gap:9px}

/* Rotating highlight — same animation as nav active state */
.rotating-highlight{position:relative!important;border:1px solid #4475d5!important;isolation:isolate;overflow:hidden!important}
.rotating-highlight::before{content:"";position:absolute;inset:-140%;z-index:-2;pointer-events:none;background:conic-gradient(from 0deg,transparent 0deg,transparent 285deg,#78d4ff 325deg,#4f83ff 345deg,transparent 360deg);animation:navBlueSpin 1.8s linear infinite}

#uploadSection.rotating-highlight::after{background:rgba(255,255,255,.98)}
#querySection.rotating-highlight::after{background:#fff}
@media(max-width:900px){.layout{grid-template-columns:190px minmax(0,1fr)}.main{padding:16px}.hero{grid-template-columns:1fr}.hero-copy{padding:10px}.filecard{min-height:190px}.hero h1{font-size:23px}.metrics{gap:8px}.metric{min-width:55px;padding-left:8px}}
@media(max-width:650px){.layout{grid-template-columns:1fr}.sidebar{min-height:0;padding:12px}.brand{padding-bottom:12px}.nav{display:inline-flex;margin:2px;padding:9px}.quote{display:none}.main{padding:12px}.cardhead{align-items:flex-start;flex-direction:column}.metrics{width:100%;justify-content:space-between}.queryrow{flex-direction:column}.run{min-height:42px}.hero h1{font-size:22px}}
</style></head><body><div id="root"></div><script>
'use strict';
let args={}, state={page:1,query:'',file:null,busyQuery:false,busyUpload:false,busyEda:false};
const root=document.getElementById('root');
let eventCounter=0;
function send(value){value.event_id=String(Date.now())+'-'+(++eventCounter)+'-'+Math.random().toString(36).slice(2,8);window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value,dataType:'json'},'*');}
function ready(){window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');}
function height(){const h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight,60);window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:h},'*');}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(x){if(x===null||x===undefined||x==='')return '<span class="blank">Missing</span>';return esc(x);}
function typeName(t){if(/int|float|double|decimal/i.test(t||''))return 'Number';if(/date|time/i.test(t||''))return 'Date';return 'Text';}

/* ── Nav item helper ─────────────────────────────────────────────────── */
// "upload" and "query" are sections on the home page, not separate pages.
// They highlight as active when the current nav matches them, but the home
// page content is always fully rendered when nav is home/upload/query.
function isHomePage(nav){return nav==='home'||nav==='upload'||nav==='query';}
function navItem(label,key,icon){
  const active=args.nav===key||(key==='home'&&isHomePage(args.nav)&&args.nav!=='upload'&&args.nav!=='query')
               ?args.nav===key:args.nav===key;
  const busy=state.busyQuery&&key==='query';
  return `<div class="nav ${args.nav===key?'active':''} ${busy?'busy':''}" data-nav="${key}" title="${label}"><span class="navicon" aria-hidden="true">${icon}</span><span class="navlabel">${label}</span></div>`;
}

/* ── Upload status ───────────────────────────────────────────────────── */
function uploadStatus(title,detail){
  const drop=document.getElementById('drop');if(!drop)return;
  drop.classList.add('uploading');
  const strong=drop.querySelector('strong'),smalls=drop.querySelectorAll('small'),btn=document.getElementById('chooseFile');
  if(strong)strong.textContent=title;if(smalls[0])smalls[0].textContent=detail||'Please wait…';
  if(btn){btn.disabled=true;btn.textContent='Processing…';btn.style.opacity='.7';}
}

/* ── Query submission ────────────────────────────────────────────────── */
function sendQuery(value){
  if(state.busyQuery)return;
  state.busyQuery=true;state.query=value;
  const run=document.getElementById('run');
  if(run){run.disabled=true;run.textContent='Running…';run.style.opacity='.75';}
  document.querySelectorAll('[data-nav="query"]').forEach(el=>el.classList.add('busy'));
  send({action:'query',query:value});
}

/* ── Scroll + highlight section (works inside Streamlit iframe) ─────── */
function scrollToSection(sectionId){
  const el=document.getElementById(sectionId);
  if(!el)return;
  // Apply the rotating highlight animation to the section
  el.classList.add('rotating-highlight');
  // Remove after 4 s so repeated clicks re-trigger it
  clearTimeout(el._highlightTimer);
  el._highlightTimer=setTimeout(()=>el.classList.remove('rotating-highlight'),4000);
  // Try to scroll the parent (Streamlit) page to this element
  try{
    const frame=window.frameElement;
    const parent=window.parent;
    if(frame&&parent&&parent!==window){
      const frameTop=frame.getBoundingClientRect().top+parent.scrollY;
      const elTop=el.getBoundingClientRect().top;
      const targetScroll=Math.max(0,frameTop+elTop-parent.innerHeight*0.15);
      const scroller=parent.document.scrollingElement||parent.document.documentElement;
      scroller.scrollTo({top:targetScroll,behavior:'smooth'});
    }
  }catch(e){}
  // The home page content is one tall Streamlit component. Let the parent
  // document own vertical scrolling; scrolling inside this iframe can trap
  // the wheel and make it impossible to return to the top. Only use the
  // iframe fallback when parent scrolling is genuinely unavailable.
  try{
    const frame=window.frameElement;
    const parent=window.parent;
    const scroller=parent.document.scrollingElement||parent.document.documentElement;
    if(!(frame&&parent&&parent!==window&&scroller)){
      el.scrollIntoView({behavior:'smooth',block:'start'});
    }
  }catch(e){ /* cross-origin parent: leave normal page scrolling intact */ }
}

/* ── Sidebar HTML ────────────────────────────────────────────────────── */
function sidebar(){
  const nav=args.nav||'home';
  const collapsed = !!args.sidebar_collapsed && nav === 'eda';
  return `<aside class="sidebar ${collapsed ? 'sidebar-collapsed' : ''}">
    ${nav === 'eda' ? `<button class="eda-nav-toggle" data-sidebar-toggle title="${collapsed ? 'Expand navigation' : 'Collapse navigation'}" aria-label="${collapsed ? 'Expand navigation' : 'Collapse navigation'}">${collapsed ? '»' : '«'}</button>` : ''}
    <div class="brand"><div class="mark">A</div><div><div class="brandname">AUTOLYTICS</div><div class="tagline">From Data to Decisions</div></div></div>
    ${navItem('Home','home','⌂')}
    ${navItem('Upload Dataset','upload','⇧')}
    ${navItem('Query Dataset','query','⌕')}
    ${navItem('EDA &amp; Charts','eda','▥')}
    ${navItem('Modeling','modeling','♧')}
    ${navItem('Reports','reports','▤')}
    <div class="quote">"Better data.<br>Smarter decisions."<br><span style="font-size:22px">—</span></div>
  </aside>`;
}

/* ── EDA shell (compact — Python renders charts below iframe) ────────── */
function renderEda(){
  // Keep the custom AUTOLYTICS navigation visible while the Streamlit-native
  // EDA dashboard renders in the parent page. The iframe is fixed to the
  // sidebar width by app.py, so this shell must not render duplicate content.
  const collapsed = !!args.sidebar_collapsed && (args.nav||'home') === 'eda';
  return `<div class="layout eda-mode ${collapsed ? 'is-collapsed' : ''}">${sidebar()}<main class="main" aria-hidden="true"></main></div>`;
}

/* ── Home page (upload + dataset preview + query — all on one page) ──── */
function renderHome(){
  const nav=args.nav||'home';
  const data=args.data||{};
  const rows=data.rows||[],cols=data.columns||[],total=data.total_rows||0;
  const file=args.file||null;

  let html=`<div class="layout">${sidebar()}<main class="main">`;

  /* Hero / Upload section — always visible on home page */
  const uploadHighlight=nav==='upload'?'rotating-highlight':'';
  html+=`<section class="hero">
    <div class="hero-copy">
      <div class="eyebrow">WELCOME TO AUTOLYTICS</div>
      <h1>Upload your dataset and<br>start exploring your data</h1>
      <p class="sub">Get instant insights with automatic cleaning, smart queries and data analysis.</p>
      <div class="art"><span>☁</span><span style="font-size:34px">▤</span><span style="font-size:12px;font-weight:800">CSV&nbsp;&nbsp; XLSX</span></div>
    </div>
    <div class="filecard ${uploadHighlight}" id="uploadSection">
      <div class="drop" id="drop">
        <div class="uploadicon">⇧</div>
        <strong>Drag &amp; drop your file here</strong>
        <small>or</small>
        <button class="run" id="chooseFile" type="button" style="margin-top:12px;min-height:37px">Choose File</button>
        <small>Supports CSV and Excel files (.csv, .xlsx)</small>
        <input id="file" type="file" accept=".csv,.xlsx" class="hidden">
      </div>
      ${file?`<div class="fileinfo"><span style="font-size:24px;color:#8aa6db">▤</span><span class="fname">${esc(file.name)}</span><span>${esc(file.size_label)}</span><button data-action="clearfile" title="Remove file">×</button></div>`:''}
    </div>
  </section>`;

  /* Dataset preview — visible once a file is loaded */
  if(rows.length||total){
    html+=`<section class="card">
      <div class="cardhead">
        <div>
          <div class="headtitle"><span class="headicon">▤</span>Dataset Preview</div>
          <div class="muted" style="margin-top:6px">Automatically cleaned and imputed working dataset</div>
        </div>
        <div class="metrics">
          <div class="metric"><div class="mlabel">▦ Rows</div><div class="mvalue">${Number(total).toLocaleString()}</div></div>
          <div class="metric"><div class="mlabel">☷ Columns</div><div class="mvalue">${cols.length}</div></div>
          <div class="metric"><div class="mlabel">▢ File Size</div><div class="mvalue">${esc(file?.size_label||'—')}</div></div>
        </div>
      </div>
      ${args.cleaning_summary?`<div class="cleaning">✓ ${esc(args.cleaning_summary)}</div>`:''}
      <div class="tablewrap">
        <table class="table">
          <thead><tr>${cols.map(c=>`<th>${esc(c.name)}<span>(${typeName(c.type)})</span></th>`).join('')}</tr></thead>
          <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${fmt(r[c.name])}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      </div>
      <div class="tablefoot">
        <span>Showing ${total?Math.min((state.page-1)*5+1,total):0}–${Math.min(state.page*5,total)} of ${Number(total).toLocaleString()} rows</span>
        <div class="pages">
          <button data-page="${Math.max(1,state.page-1)}">‹</button>
          <button class="active">${state.page}</button>
          <button data-page="${Math.min(Math.ceil(total/5),state.page+1)}">›</button>
        </div>
      </div>
    </section>`;
  }else{
    html+=`<section class="card" style="text-align:center;padding:25px;color:#7185a6">Your dataset preview will appear here after you upload a CSV or Excel file.</section>`;
  }

  /* Query section — always on the home page; highlighted when nav=query */
  const queryHighlight=nav==='query'?'rotating-highlight':'';
  const qResult=args.query_result;
  const qError=args.query_error;
  html+=`<section class="card ${queryHighlight}" id="querySection">
    <div class="querytitle"><span class="headicon">✦</span>Ask a Question About Your Data</div>
    <div class="qsub">Type your query in natural language or write SQL. Get instant results below.</div>
    <div class="queryrow">
      <textarea id="query" placeholder="Example: Show total sales by city  |  Which product has the highest revenue?  |  Write a SQL query...">${esc(state.query)}</textarea>
      <button class="run" id="run">➤ &nbsp;Run Query</button>
    </div>
    <div class="suggestions">
      <b>✦ &nbsp;Try asking:</b>
      <button class="chip" data-query="Show the first 5 rows">Show the first 5 rows</button>
      <button class="chip" data-query="Average Age by Gender">Average age by gender</button>
      <button class="chip" data-query="Count records by category">Count records by category</button>
      <button class="chip" data-query="How many records are there?">Count records</button>
    </div>
    ${qError?`<div class="msg">${esc(qError)}</div>`:''}
    ${qResult?`<div class="result">
      ${qResult.sql?`<div style="font-weight:750;font-size:12px;margin-bottom:8px">${qResult.generated_sql?'Generated SQL':'Executed SQL'}</div><div class="sql">${esc(qResult.sql)}</div>`:''}
      ${qResult.rows?`<div style="font-weight:750;font-size:12px;margin:13px 0 8px">Query Results</div>
        <div class="tablewrap"><table class="table">
          <thead><tr>${qResult.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
          <tbody>${qResult.rows.map(r=>`<tr>${qResult.columns.map(c=>`<td>${fmt(r[c])}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>
        <div class="muted" style="margin-top:8px">${qResult.count} result rows</div>`:''}
    </div>`:''}
  </section>`;

  html+='</main></div>';
  return html;
}

/* ── Master render ───────────────────────────────────────────────────── */
function render(){
  // Reset busy flags when results arrive
  if(args.query_result||args.query_error)state.busyQuery=false;
  if(args.file)state.busyUpload=false;
  if(args.eda_has_result||args.eda_error)state.busyEda=false;

  const nav=args.nav||'home';

  if(nav==='eda'){
    // On the EDA page Python renders all content below this iframe.
    // Report height=1 so Streamlit allocates no space for the component.
    root.innerHTML=renderEda();
    bindCommon();
    window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:1},'*');
    return;
  }
  if(nav==='modeling'){
    // Modeling page: Python renders all content; iframe is sidebar-only via fixed CSS.
    root.innerHTML=`<div class="layout">${sidebar()}<main class="main"></main></div>`;
    bindCommon();
    window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:1},'*');
    return;
  }
  if(nav==='reports'){
    root.innerHTML=`<div class="layout">${sidebar()}<main class="main"></main></div>`;
    bindCommon();
    window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:1},'*');
    return;
  }
  // home / upload / query all render the same full home page
  root.innerHTML=renderHome();
  bindCommon();
  bindHome();
  // Report height after DOM paint so scrollHeight is accurate
  requestAnimationFrame(()=>{
    height();
    // Re-report after images/fonts settle
    setTimeout(height,400);
  });

  // Do not auto-scroll during ordinary rerenders (including successful uploads).
  // Section scrolling is triggered only by an explicit sidebar navigation click.
}

/* ── Event binding ───────────────────────────────────────────────────── */
function bindCommon(){
  document.querySelectorAll('[data-sidebar-toggle]').forEach(el=>{
    el.onclick=e=>{
      e.preventDefault();e.stopPropagation();
      args.sidebar_collapsed=!args.sidebar_collapsed;
      render();
      send({action:'sidebar_toggle'});
    };
  });
  // Nav clicks — one listener per element, no duplicates (innerHTML replaced each render)
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick=e=>{
      e.preventDefault();e.stopPropagation();
      const target=el.dataset.nav;
      // For upload/query: update nav state and send to Python,
      // but keep on the home page by not changing args.nav locally —
      // let Python send back the updated nav on rerun.
      args.nav=target;
      render();
      send({action:'nav',nav:target});
      if(target==='upload'||target==='query'){
        const sectionId=target==='upload'?'uploadSection':'querySection';
        requestAnimationFrame(()=>scrollToSection(sectionId));
        setTimeout(()=>scrollToSection(sectionId),180);
      }
    };
  });
}

function bindHome(){
  // File input
  const inp=document.getElementById('file');
  const drop=document.getElementById('drop');
  if(inp&&drop){
    drop.onclick=e=>{if(!e.target.closest('#chooseFile'))inp.click();};
    const choose=document.getElementById('chooseFile');
    if(choose)choose.onclick=e=>{e.preventDefault();e.stopPropagation();inp.click();};
    inp.onchange=()=>{if(inp.files[0])readFile(inp.files[0]);};
    drop.ondragover=e=>{e.preventDefault();drop.style.background='#edf4ff';};
    drop.ondragleave=()=>{drop.style.background='';};
    drop.ondrop=e=>{e.preventDefault();drop.style.background='';if(e.dataTransfer.files[0])readFile(e.dataTransfer.files[0]);};
  }
  // Clear file
  document.querySelectorAll('[data-action="clearfile"]').forEach(el=>{
    el.onclick=()=>send({action:'clear_file'});
  });
  // Pagination
  document.querySelectorAll('[data-page]').forEach(el=>{
    el.onclick=()=>{state.page=Number(el.dataset.page);send({action:'page',page:state.page});};
  });
  // Query textarea
  const q=document.getElementById('query');
  if(q){
    q.oninput=()=>{state.query=q.value;};
    q.onkeydown=e=>{
      if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();e.stopPropagation();sendQuery(q.value);}
    };
  }
  // Run button
  const run=document.getElementById('run');
  if(run)run.onclick=e=>{e.preventDefault();sendQuery(q?q.value:'');};
  // Suggestion chips
  document.querySelectorAll('[data-query]').forEach(el=>{
    el.onclick=()=>{state.query=el.dataset.query;sendQuery(state.query);};
  });
}

/* ── File reader + upload ────────────────────────────────────────────── */
async function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{const r=String(reader.result||'');resolve(r.includes(',')?r.slice(r.indexOf(',')+1):r);};
    reader.onerror=()=>reject(new Error('Could not encode file'));
    reader.readAsDataURL(blob);
  });
}
async function readFile(file){
  if(state.busyUpload)return;
  const name=file.name.toLowerCase();
  if(!name.endsWith('.csv')&&!name.endsWith('.xlsx')){send({action:'upload_error',error:'Please choose a CSV or XLSX file.'});return;}
  state.busyUpload=true;
  uploadStatus('Preparing your dataset…',file.size>15*1024*1024?'Large file detected. Compressing to speed up transfer.':'Reading selected file.');
  await new Promise(resolve=>requestAnimationFrame(()=>resolve()));
  try{
    let payloadBlob=file,compressed=false;
    if(name.endsWith('.csv')&&'CompressionStream' in window){
      uploadStatus('Compressing CSV…','This reduces upload time for large CSV files.');
      payloadBlob=await new Response(file.stream().pipeThrough(new CompressionStream('gzip'))).blob();
      compressed=true;
    }
    uploadStatus('Sending dataset…','Please keep this tab open while AUTOLYTICS processes the file.');
    const data=await blobToBase64(payloadBlob);
    send({action:'upload',name:file.name,size:file.size,data,compressed});
  }catch(err){
    state.busyUpload=false;
    send({action:'upload_error',error:'The selected file could not be read. Please try again.'});
  }
}

/* ── Streamlit message handler ───────────────────────────────────────── */
window.addEventListener('message',e=>{
  if(!e.data||e.data.type!=='streamlit:render')return;
  args=e.data.args||{};
  if(args.query_result||args.query_error)state.busyQuery=false;
  if(args.file)state.busyUpload=false;
  if(args.eda_has_result||args.eda_error)state.busyEda=false;
  render();
  // Intentionally do not restore scroll position on Streamlit reruns.
  // Navigation clicks perform one explicit scroll; reruns must never pull
  // the user back down after they manually scroll upward.
});
// Send ready and an initial height so Streamlit pre-allocates space before
// the first streamlit:render message arrives. Without this the component
// wrapper collapses to 0 and the content never paints on Cloud.
ready();
requestAnimationFrame(height);
</script></body></html>
